[project]
name = "malas"
version = "0.1.0"
description = "malas using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=0.75.0",
    "crewai[tools]>=0.193.2,<1.0.0",
    "docxtpl>=0.20.0",
    "fastapi>=0.110",
    "duckduckgo-search>=8.1.1",
    "langchain-community>=0.4.2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "trafilatura>=2.0.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
kickoff = "malas.main:kickoff"
run_crew = "malas.main:kickoff"
malas-web = "malas.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
