[project]
name = "malas"
version = "0.1.0"
description = "malas using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=0.75.0",
    "crewai[tools]>=0.193.2,<1.0.0",
    "docxtpl>=0.20.0",
    "duckduckgo-search>=8.1.1",
    "langchain-community>=0.4.2",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
kickoff = "malas.main:kickoff"
run_crew = "malas.main:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
