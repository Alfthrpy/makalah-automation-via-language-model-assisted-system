# Root monorepo: workspace uv (Python). Paket JS dikelola pnpm (lihat pnpm-workspace.yaml).
[tool.uv.workspace]
members = ["apps/api", "packages/engine"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "apps/api/tests"]
# tiap folder tes berdiri sendiri (tests/utils.py di engine tidak bentrok dengan api)
addopts = "--import-mode=importlib -p no:cacheprovider"
pythonpath = ["packages/engine/tests"]

[tool.ruff]
line-length = 120
