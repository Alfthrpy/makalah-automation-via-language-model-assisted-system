# (v3: + diagnostik per provider)
# Uji NYATA pencarian referensi (malas.refsearch) di runner ber-internet. Tanpa LLM, tanpa secret wajib.
# Sementara: dipakai untuk membuktikan pendekatan baru; boleh dihapus setelah selesai.
name: refsearch-probe

on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-maxwell-xdh9bs]
    paths: [".github/workflows/refsearch-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: packages/engine/src
      MALAS_CONTACT_EMAIL: ${{ secrets.MALAS_CONTACT_EMAIL }}
      MALAS_OPENALEX_API_KEY: ${{ secrets.MALAS_OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic requests python-dotenv pypdf trafilatura pyyaml
      - name: Status tiap API (tanpa key)
        shell: bash {0}  # tanpa -e: satu API gagal tidak menghentikan sisanya
        run: |
          for u in \
            "https://api.openalex.org/works?search=machine+learning&per-page=1&select=id,title" \
            "https://api.crossref.org/works?query.bibliographic=machine+learning&rows=1&select=DOI,title" \
            "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=stroke&format=json&pageSize=1" \
            "https://export.arxiv.org/api/query?search_query=all:graph&max_results=1" \
            "https://doaj.org/api/search/articles/pendidikan?pageSize=1" \
            "https://id.wikipedia.org/w/api.php?action=query&format=json&list=search&srsearch=majapahit&srlimit=1" \
            "https://openlibrary.org/search.json?q=majapahit&limit=1&fields=key,title"; do
            out=$(curl -s -o /tmp/r.txt -w "%{http_code} %{time_total}s" -A "malas-refsearch-probe/0.1" -m 40 "$u" || true)
            echo "== ${out:-timeout/err}  $u"; head -c 200 /tmp/r.txt 2>/dev/null; echo; rm -f /tmp/r.txt
          done
      - name: Uji refsearch (8 topik, full-text)
        run: python -m malas.refsearch --fulltext --no-cache --json hasil.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-refsearch
          path: hasil.json
          if-no-files-found: ignore
