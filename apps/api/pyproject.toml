[project]
name = "malas-api"
version = "0.1.0"
description = "MALAS API: FastAPI + antrean job, memakai malas-engine"
requires-python = ">=3.10,<3.14"
dependencies = [
    "malas-engine",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "cryptography>=43",
    "pyjwt[crypto]>=2.8",
    "tzdata>=2024.1",
]

[tool.uv.sources]
malas-engine = { workspace = true }

[project.scripts]
malas-web = "malas_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/malas_api"]
