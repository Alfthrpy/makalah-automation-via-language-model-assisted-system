[project]
name = "malas-api"
version = "0.1.0"
description = "MALAS API: FastAPI + antrean job, memakai malas-engine"
requires-python = ">=3.10,<3.14"
dependencies = [
    "malas-engine",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.uv.sources]
malas-engine = { workspace = true }

[project.scripts]
malas-web = "malas_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/malas_api"]
