# Render Blueprint untuk MALAS (mode hosting tanpa login, pengguna membawa API key sendiri).
# Panduan lengkap: DEPLOY.md
services:
  - type: web
    name: malas
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free            # 512 MB RAM; bila sering kehabisan memori pilih paket dengan RAM lebih besar (DEPLOY.md)
    region: singapore     # terdekat dari Indonesia; ganti bila perlu (oregon, frankfurt, ohio, virginia)
    healthCheckPath: /healthz
    envVars:
      # --- keamanan & privasi (jangan diubah untuk hosting publik) ---
      - key: MALAS_WEB_REQUIRE_KEY      # wajib API key milik pengguna; key server tidak pernah dipakai
        value: "1"
      - key: MALAS_WEB_RETENTION_HOURS  # riwayat & berkas dihapus otomatis setelah N jam
        value: "6"
      - key: MALAS_WEB_MAX_QUEUE        # batas total job aktif (aman untuk 1 pekerja)
        value: "5"
      # --- hemat memori di free tier (512 MB) ---
      - key: MALAS_FULLTEXT             # 0 = abstrak saja; PDF besar bisa melonjakkan RAM. Set 1 di paket >= 1 GB
        value: "0"
      # --- teknis ---
      - key: MALAS_WEB_HOST
        value: 0.0.0.0
      - key: MALAS_OUTPUT_DIR
        value: /tmp/malas-output
